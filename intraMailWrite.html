    <script type="text/javascript">
        //받는사람 선택팝업창에서 호출
        function DoSelectedEmpAuth(empcode, empname) {
            form1.txtSelEmpName.value = empname;
            form1.hdSelEmpCode.value = empcode;
        }
        //내게 쓰기
        function jsSendForMe() {
            if (form1.chkSendForMe.checked != true) {
                form1.hdSelEmpCode.value = '';
                form1.txtSelEmpName.value = '';
                return;
            }

            form1.hdSelEmpCode.value = '172';
            form1.txtSelEmpName.value = '함정우';
            return true;
        }
        function jsSendOK() {
            if (form1.txtSelEmpName.value.length < 1) {
                alert("받는사람을 선택해 주십시오.");
                form1.txtSelEmpName.focus();
                return false;
            }
            if (form1.txtTitle.value.length < 1 || form1.txtTitle.value == "제목") {
                alert("제목을 입력해 주십시오.");
                form1.txtTitle.focus();
                return false;
            }
            if (form1.txtContent.value.length < 1 || form1.txtContent.value == "내용") {
                alert("내용을 입력해 주십시오.");
                form1.txtContent.focus();
                return false;
            }
            return true;
        }

        //첨부파일 보임[2011.09.26]
        function jsAddAttach() {
            for (k = 1; k <= 10; k++) {
                var elem = document.getElementById("AttachFile" + k);
                if (elem != null && elem.style.display == "none") {
                    elem.style.display = "block";
                    break;
                }
            }

            return false;
        }

        //첨부파일 숨김[2011.09.26]
        function jsRemoveAttach() {
            for (k = 10; k >= 1; k--) {
                var elem = document.getElementById("AttachFile" + k);
                if (elem != null && elem.style.display == "block") {
                    elem.style.display = "none";
                    break;
                }
            }

            return false;
        }

        //기존 첨부파일 삭제(전달시 기존 메일 첨부파일)
        function jsRemoveAttachOld(idx, filepath) {
            var elem = document.getElementById("attatchold_" + idx);
            if (elem != null) {
                elem.style.display = 'none';
                if (form1.hdDelFileCode.value.length > 0) form1.hdDelFileCode.value += "<";
                form1.hdDelFileCode.value += filepath;
            }
        }
    </script>

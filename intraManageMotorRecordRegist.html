    <script type="text/javascript">
        //저장
        function jsSaveOK() {
            if (form1.ddlMotorType.value == 0) {
                alert("차종을 선택해주세요.");
                form1.ddlMotorType.focus();
                return false;
            }
            if (form1.txtFirstMileage.value.length == 0) {
                alert("시작 주행누계를 입력해주세요.");
                form1.txtFirstMileage.focus();
                return false;
            }
            if (form1.txtLastMileage.value.length == 0) {
                alert("마침 주행누계를 입력해주세요.");
                form1.txtLastMileage.focus();
                return false;
            }
            if (form1.txtFirstMileage.value * 1 > form1.txtLastMileage.value * 1) {
                alert("시작 주행누계가 마침 주행누계보다 큽니다.\r\n다시 확인하시고 입력하세요.");
                form1.txtFirstMileage.focus();
                return false;
            }
            if (form1.txtReportyymmdd.value.length == 0) {
                alert("신청일을 선택해주세요.");
                form1.txtReportyymmdd.focus();
                return false;
            }
            if (form1.txtRecordyymmdd.value.length == 0) {
                alert("운행일을 선택해주세요.");
                form1.txtRecordyymmdd.focus();
                return false;
            }
            return true;
        }

        function onlyNumber(){
           if((event.keyCode<48)||(event.keyCode>57))
              event.returnValue=false;
       }

       function showMyImage(fileInput) {
           var files = fileInput.files;
           var vFileID = fileInput.getAttribute('id');
           for (var i = 0; i < files.length; i++) {
               var file = files[i];
               var imageType = /image.*/;
               if (!file.type.match(imageType)) {
                   continue;
               }
               var img = document.getElementById('thumbnil' + vFileID);
               var Preimg = document.getElementById('lb' + vFileID);
               img.style.display = "";
               Preimg.style.display = "none";
               img.file = file;
               var reader = new FileReader();
               reader.onload = (function (aImg) {
                   return function (e) {
                       aImg.src = e.target.result;
                   };
               })(img);
               reader.readAsDataURL(file);
           }
       }

       //maxlength
       function jsMaxLength(obj) {
           var maxlength = parseInt(obj.getAttribute("maxlength"));
           if (obj.value.length > maxlength) {
               alert("한글 " + maxlength + "자 이내로 제한됩니다.");
               obj.value = obj.value.substring(0, maxlength);
           }
       }

       //Mileage
       function jsMileage(obj) {
           var FirstMileage = document.getElementById("txtFirstMileage");
           var LastMileage = document.getElementById("txtLastMileage");
           var Mileage = document.getElementById("txtMileage");

           if (obj == 0) {
               Mileage.value = LastMileage.value - FirstMileage.value;
           }
           else if (obj == 1 && FirstMileage.value != "") {
               LastMileage.value = parseInt(FirstMileage.value) + parseInt(Mileage.value);
           }
       }

       //출발지 
       function jsDeparture(obj) {
           if (obj != 3) {
               document.getElementById("txtDeparture").value = "";
               document.getElementById("txtDepartureAddress").value = "";
               document.getElementById("txtDeparture").style.display = "none";
               document.getElementById("txtDepartureAddress").style.display = "none";
           }
           else {
               document.getElementById("txtDeparture").style.display = "";
               document.getElementById("txtDepartureAddress").style.display = "";
           }
       }

       //도착지 
       function jsArrival(obj) {
           if (obj != 3) {
               document.getElementById("txtArrival").value = "";
               document.getElementById("txtArrivalAddress").value = "";
               document.getElementById("txtArrival").style.display = "none";
               document.getElementById("txtArrivalAddress").style.display = "none";
           }
           else {
               document.getElementById("txtArrival").style.display = "";
               document.getElementById("txtArrivalAddress").style.display = "";
           }
       }

       //방문목적 
       function jsDestination(obj) {
           if (obj != 0) {
               document.getElementById("txtDestination").value = "";
               document.getElementById("txtDestination").style.display = "none";
           }
           else {
               document.getElementById("txtDestination").style.display = "";
           }
       }
    </script>

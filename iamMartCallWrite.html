		function jsSelEmp() {
			var chkSecurity = $('#chkSecurity').prop('checked');
			var emptype = $('#hEmpType').val();

			if (chkSecurity) jsPopSelEmp('DoSelectedToEmp', 0, 0, 0, 1); //보안콜은 어차피 본사직원만 보이니까 emptype 분기 필요없음.

				else jsPopSelEmp('DoSelectedToEmp', 0, 0, 0, 0, 1); //파사, 자대리점은 직원선택 시 파사탭이 먼저 열리도록 함.
			}
		}

		function jsSelNextEmp() {
			var chkSecurity = $('#chkSecurity').prop('checked');
			var emptype = $('#hEmpType').val();

			if (chkSecurity) jsPopSelEmp('DoSelectedApEmp', 0, 0, 0, 1);

				else jsPopSelEmp('DoSelectedApEmp', 0, 0, 0, 0, 1);
			}
		}

			form1.txtMartName1.value = martname;

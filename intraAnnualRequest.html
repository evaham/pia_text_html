    <script type="text/javascript">        
        //휴가 승인자
        function DoSelectedApEmp(empcode, empname) {
            form1.txtApEmpName.value = empname;
            form1.hApEmpName.value = empname;
            form1.hApEmp.value = empcode;
        }
        //휴가 참조자
        function DoSelectedReferEmp(postcode, empcode, empname) {
            form1.txtReferEmpName.value = empname;
            form1.hReferEmpName.value = empname;
            form1.hReferEmp.value = empcode;
            form1.hReferEmpPost.value = postcode;
        }
        function jsViewChange() {
            var vType = document.getElementById("ddlType");
            var index = vType.options.selectedIndex;
            if (vType.options[index].value == "2" || vType.options[index].value == "4" || vType.options[index].value == "6" || vType.options[index].value == "99") {
                document.getElementById("lblspace").style.display = "none";
                document.getElementById("txtDateEnd").style.display = "none";
                document.getElementById("btnCal2").style.display = "none";
                document.getElementById("ddlHalf").style.display = "";
            } else {
                document.getElementById("lblspace").style.display = "";
                document.getElementById("txtDateEnd").style.display = "";
                document.getElementById("btnCal2").style.display = "";
                document.getElementById("ddlHalf").style.display = "none";
            }
        }
        function jsDateChange() {
            var dateStart = $('#txtDateStart').val();
            $('#txtDateEnd').val(dateStart);

            //휴가일의 연도가 바뀌면 휴가유형을 재바인딩 한다. 신청할 휴가일이 올해냐 내년이냐에 따라 잔여연차수가 달라지므로 사용할 수 있는 휴가유형도 달라질 수 있다.
            if (dateStart.substring(0, 4) != $('#hYear').val()) {
                $('#hYear').val(dateStart.substring(0, 4));
                $('#btnAnnTypeBind').click();
            }
        }

        function jsChkEndDate() {
            var dateStart = $('#txtDateStart').val();
            var dateEnd = $('#txtDateEnd').val();

            //연도별로 신청할 수 있는 휴가 유형이 달라질 수 있으므로 끊어서 신청하도록 한다.
            if (dateStart.substring(0, 4) != dateEnd.substring(0, 4)) {
                alert("연단위로 끊어서 신청해주세요.");
                $('#txtDateEnd').val(dateStart);
                return false;
            }
            return true;
        }

        //저장
        function jsSaveOK() {
            if (form1.ddlType.value == 0) {
                alert("휴가명을 선택해주세요.");
                form1.ddlType.focus();
                return false;
            }
            if (document.getElementById("txtApEmpName").value.length == 0) {
                alert("휴가승인자를 선택해주세요");
                return false;
            }
            return true;
        }
        function jsDel() {
            return confirm("신청한 휴가를 삭제하시겠습니까?");
        }
        function jsApproval(vReqType) {

            var hAuCode = form1.hAuCode.value;
            var hAaCode = form1.hAaCode.value;

            if (vReqType == "C") {
                if (confirm("휴가 승인을 취소하시겠습니까?")) {
                    PageMethods.AnnualCancel(vReqType, hAuCode, hAaCode, OnAnnualCancelSuccess, OnAnnualCancelFail);
                    return false;
                }
            }
        }
        function OnAnnualCancelSuccess(result) {
            //처리내용 alert
            alert(result);
            //검색refresh
            jsRefresh();
        }
        function OnAnnualCancelFail(result) {
            //실패내용 alert
            alert(result);
        }
    </script>

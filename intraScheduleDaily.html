    <script type="text/javascript">

        //전날
        function jsPrevDay() {
            var spanDate = document.getElementById("spanDate").innerHTML.split(/[.]/);
            var date = new Date(spanDate[0], spanDate[1] - 1, spanDate[2] - 1);
            var spanDay = document.getElementById("spanDay");

            var week = new Array("일", "월", "화", "수", "목", "금", "토");
            var hdCode = document.getElementById("hdCode");
            var hdDate = document.getElementById("hdDate");
            var hdDay = document.getElementById("hdDay");
            
            spanDate.innerHTML = date.format("yyyy.MM.dd");
            spanDay.innerHTML = week[date.getDay()];

            hdDate.value = spanDate.innerHTML;
            hdDay.value = spanDay.innerHTML;
            hdCode.value = "1";
            eval("__doPostBack('btnGo','')");
        }

        //다음날
        function jsAfterDay() {
            var spanDate = document.getElementById("spanDate").innerHTML.split(/[.]/);
            var date = new Date(spanDate[0], spanDate[1] - 1, spanDate[2]);
            var spanDay = document.getElementById("spanDay");

            var week = new Array("일", "월", "화", "수", "목", "금", "토");
            var hdCode = document.getElementById("hdCode");
            var hdDate = document.getElementById("hdDate");
            var hdDay = document.getElementById("hdDay");

            date.setDate(date.getDate() + 1);

            spanDate.innerHTML = date.format("yyyy.MM.dd");
            spanDay.innerHTML = week[date.getDay()];

            hdDate.value = spanDate.innerHTML;
            hdDay.value = spanDay.innerHTML;
            hdCode.value = "1";
            eval("__doPostBack('btnGo','')");
        }

        //읽기
        function jsScheduleRead(code, veauCode) {
            var spanDate = document.getElementById("spanDate");
            location.href = "IntraScheduleRead.html?sch=" + code + "&auCode=" + veauCode + "&schDate=" + spanDate.innerHTML + "&where=diary";
        }

        //쓰기
        function jsPopScheduleAdd() {
            location.href = "./IntraScheduleWrite.html";
        }
    </script>
